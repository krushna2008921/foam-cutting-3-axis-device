<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#080c1a" rx="12"/>
  <g stroke="rgba(0,240,255,0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="500" y2="80"/><line x1="0" y1="160" x2="500" y2="160"/><line x1="0" y1="240" x2="500" y2="240"/>
  </g>
  <!-- Foam Packaging Insert Block -->
  <g transform="translate(100, 60)">
    <!-- Base foam block -->
    <polygon points="50,40 250,40 290,80 90,80" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <polygon points="90,80 290,80 290,180 90,180" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <polygon points="250,40 290,80 290,180 250,140" fill="#334155" stroke="#475569" stroke-width="1.5"/>

    <!-- Cutout Pocket 1 (Cylindrical Lens/Tool pocket) -->
    <ellipse cx="150" cy="110" rx="30" ry="15" fill="#020617" stroke="#00f0ff" stroke-width="1.5"/>
    <path d="M 120 110 L 120 135 A 30 15 0 0 0 180 135 L 180 110" fill="#020617" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Cutout Pocket 2 (Rectangular Instrument Pocket) -->
    <polygon points="200,95 260,95 240,120 180,120" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="180,120 240,120 240,140 180,140" fill="#0b0f19" stroke="#38bdf8" stroke-width="1"/>

    <!-- Precision Kerf Dimension Marks -->
    <line x1="120" y1="70" x2="180" y2="70" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="150" y="65" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f59e0b" text-anchor="middle">±0.25mm TOLERANCE</text>
  </g>
  <rect x="20" y="20" width="180" height="24" rx="4" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1"/>
  <text x="110" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle">CUSTOM PACKAGING INSERTS</text>
</svg>