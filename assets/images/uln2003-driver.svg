<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="driverPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="ledGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background grid -->
  <rect width="400" height="300" fill="#080c1a" rx="12"/>
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250" stroke="rgba(0,240,255,0.05)" stroke-width="1"/>
  <path d="M 50 0 L 50 300 M 100 0 L 100 300 M 150 0 L 150 300 M 200 0 L 200 300 M 250 0 L 250 300 M 300 0 L 300 300 M 350 0 L 350 300" stroke="rgba(0,240,255,0.05)" stroke-width="1"/>

  <!-- Driver Board -->
  <g transform="translate(100, 40)">
    <!-- Board drop shadow & body -->
    <rect x="4" y="6" width="200" height="210" rx="8" fill="#000000" opacity="0.6"/>
    <rect x="0" y="0" width="200" height="210" rx="8" fill="url(#driverPcb)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Mounting holes -->
    <circle cx="15" cy="15" r="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="185" cy="15" r="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="15" cy="195" r="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="185" cy="195" r="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- ULN2003 DIP-16 IC -->
    <rect x="65" y="45" width="70" height="115" rx="3" fill="url(#chip)" stroke="#475569" stroke-width="1.5"/>
    <!-- IC notch & text -->
    <circle cx="100" cy="45" r="4" fill="#020617"/>
    <text x="100" y="100" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f8fafc" text-anchor="middle" font-weight="bold">ULN2003A</text>
    <text x="100" y="115" font-family="'JetBrains Mono', monospace" font-size="7" fill="#38bdf8" text-anchor="middle">DARLINGTON</text>

    <!-- 4 Activity LEDs (A, B, C, D) -->
    <g transform="translate(155, 55)">
      <!-- LED A -->
      <circle cx="10" cy="10" r="4" fill="#ef4444" filter="url(#ledGlow)"/>
      <text x="22" y="13" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffffff">A</text>
      <!-- LED B -->
      <circle cx="10" cy="35" r="4" fill="#f59e0b" filter="url(#ledGlow)"/>
      <text x="22" y="38" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffffff">B</text>
      <!-- LED C -->
      <circle cx="10" cy="60" r="4" fill="#10b981" filter="url(#ledGlow)"/>
      <text x="22" y="63" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffffff">C</text>
      <!-- LED D -->
      <circle cx="10" cy="85" r="4" fill="#3b82f6" filter="url(#ledGlow)"/>
      <text x="22" y="88" font-family="'JetBrains Mono', monospace" font-size="7" fill="#ffffff">D</text>
    </g>

    <!-- 5-Pin JST Motor Connector Socket -->
    <rect x="15" y="60" width="30" height="90" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <rect x="20" y="68" width="6" height="6" fill="#334155"/>
    <rect x="20" y="84" width="6" height="6" fill="#334155"/>
    <rect x="20" y="100" width="6" height="6" fill="#334155"/>
    <rect x="20" y="116" width="6" height="6" fill="#334155"/>
    <rect x="20" y="132" width="6" height="6" fill="#334155"/>

    <!-- Bottom Input Header (IN1 - IN4, VCC, GND) -->
    <g transform="translate(45, 175)">
      <circle cx="10" cy="10" r="4" fill="#fbbf24"/>
      <circle cx="28" cy="10" r="4" fill="#fbbf24"/>
      <circle cx="46" cy="10" r="4" fill="#fbbf24"/>
      <circle cx="64" cy="10" r="4" fill="#fbbf24"/>
      <circle cx="82" cy="10" r="4" fill="#fbbf24"/>
      <circle cx="100" cy="10" r="4" fill="#fbbf24"/>
      <text x="55" y="26" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#94a3b8" text-anchor="middle">IN1-IN4  +5V  GND</text>
    </g>

    <text x="100" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1">STEPPER DRIVER</text>
  </g>

  <!-- Telemetry Badge -->
  <rect x="15" y="15" width="95" height="24" rx="4" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1"/>
  <text x="62" y="31" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle">POWER DRIVER</text>
</svg>