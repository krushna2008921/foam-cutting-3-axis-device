<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e4429"/>
      <stop offset="50%" stop-color="#006633"/>
      <stop offset="100%" stop-color="#0b3820"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background grid subtle -->
  <rect width="400" height="300" fill="#080c1a" rx="12"/>
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250" stroke="rgba(0,240,255,0.05)" stroke-width="1"/>
  <path d="M 50 0 L 50 300 M 100 0 L 100 300 M 150 0 L 150 300 M 200 0 L 200 300 M 250 0 L 250 300 M 300 0 L 300 300 M 350 0 L 350 300" stroke="rgba(0,240,255,0.05)" stroke-width="1"/>

  <!-- PCB Board -->
  <g transform="translate(100, 30)">
    <!-- PCB shadow -->
    <rect x="4" y="6" width="200" height="240" rx="8" fill="#000000" opacity="0.6"/>
    <!-- PCB Base -->
    <rect x="0" y="0" width="200" height="240" rx="8" fill="url(#pcbGrad)" stroke="#10b981" stroke-width="1.5"/>

    <!-- Copper Traces -->
    <path d="M 30 50 L 30 110 L 80 110" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 170 50 L 170 110 L 120 110" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 40 180 L 80 180 L 90 140" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 160 180 L 120 180 L 110 140" stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Mini USB Connector -->
    <rect x="75" y="-12" width="50" height="32" rx="4" fill="url(#metalGrad)" stroke="#475569" stroke-width="1"/>
    <rect x="85" y="-10" width="30" height="12" rx="2" fill="#334155"/>

    <!-- ATmega328P Chip -->
    <rect x="70" y="90" width="60" height="60" rx="4" fill="url(#chipGrad)" stroke="#00f0ff" stroke-width="1.5" filter="url(#neonCyan)"/>
    <circle cx="80" cy="100" r="3" fill="#64748b"/>
    <text x="100" y="122" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">ATMEGA</text>
    <text x="100" y="134" font-family="'JetBrains Mono', monospace" font-size="7" fill="#00f0ff" text-anchor="middle">328P-AU</text>

    <!-- Pins Left Header (15 pins) -->
    <g transform="translate(10, 25)">
      <!-- Render 15 pin holes -->
      <circle cx="5" cy="10" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="22" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="34" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="46" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="58" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="70" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="82" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="94" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="106" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="118" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="130" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="142" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="154" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="166" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="178" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    </g>

    <!-- Pins Right Header (15 pins) -->
    <g transform="translate(180, 25)">
      <circle cx="5" cy="10" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="22" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="34" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="46" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="58" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="70" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="82" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="94" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="106" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="118" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="130" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="142" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="154" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="166" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
      <circle cx="5" cy="178" r="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    </g>

    <!-- Reset Switch & LEDs -->
    <rect x="88" y="165" width="24" height="14" rx="2" fill="#cbd5e1"/>
    <circle cx="100" cy="172" r="4" fill="#ef4444"/>
    <circle cx="60" cy="45" r="3" fill="#10b981" filter="url(#neonCyan)"/>
    <circle cx="70" cy="45" r="3" fill="#3b82f6"/>
    <circle cx="130" cy="45" r="3" fill="#f59e0b"/>
    <circle cx="140" cy="45" r="3" fill="#ef4444"/>

    <!-- Silkscreen Text -->
    <text x="100" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">ARDUINO</text>
    <text x="100" y="230" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">NANO V3.0</text>
  </g>

  <!-- Technical Telemetry / Badge -->
  <rect x="15" y="15" width="85" height="24" rx="4" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1"/>
  <text x="57" y="31" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle">MCU CORE</text>
</svg>