<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="#080c1a" rx="12"/>
  <g stroke="rgba(0,240,255,0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="500" y2="80"/><line x1="0" y1="160" x2="500" y2="160"/><line x1="0" y1="240" x2="500" y2="240"/>
  </g>
  <!-- NACA Airfoil Aerodynamic Wing Section -->
  <g transform="translate(60, 90)">
    <!-- Root Airfoil profile -->
    <path d="M 50 80 C 70 30, 160 20, 240 60 C 290 85, 330 90, 360 90 C 310 100, 210 115, 140 105 C 80 95, 55 90, 50 80 Z" fill="url(#foilGrad)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- 3D Extrusion Perspective to Tip -->
    <path d="M 50 80 L 110 30 C 130 0, 210 -10, 270 20 C 320 40, 340 45, 360 45 L 360 90 C 330 90, 290 85, 240 60 C 160 20, 70 30, 50 80 Z" fill="#0369a1" stroke="#00f0ff" stroke-width="1.5" opacity="0.85"/>

    <!-- Chord Line & Camber Annotation -->
    <line x1="50" y1="80" x2="360" y2="90" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="200" y="75" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b">CHORD LINE: 310mm</text>

    <!-- Cutting path trajectory overlay -->
    <path d="M 30 80 C 60 15, 170 5, 260 50 C 310 75, 350 80, 380 90" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="380" cy="90" r="4" fill="#f97316"/>
    <text x="385" y="105" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f97316">HOT WIRE CUT PATH</text>
  </g>
  <rect x="20" y="20" width="180" height="24" rx="4" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1"/>
  <text x="110" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle">AERODYNAMIC AIRFOILS</text>
</svg>