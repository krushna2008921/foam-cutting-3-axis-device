<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350" width="100%" height="100%">
  <defs>
    <linearGradient id="wireHeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="550" height="350" fill="#080c1a" rx="12"/>
  
  <!-- Diagram Title -->
  <rect x="20" y="20" width="150" height="26" rx="4" fill="rgba(249,115,22,0.1)" stroke="#f97316" stroke-width="1"/>
  <text x="95" y="37" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f97316" text-anchor="middle" font-weight="bold">THERMAL CUTTER SUB-ASSEMBLY</text>

  <!-- Main Assembly Bow / Carriage Arm -->
  <g transform="translate(60, 60)">
    <!-- Left Stanchion / Carriage Mount -->
    <rect x="0" y="30" width="40" height="180" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="50" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="20" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Z1</text>
    <circle cx="20" cy="190" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>

    <!-- Left Ceramic Insulator Post -->
    <rect x="40" y="105" width="25" height="30" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="48" y1="105" x2="48" y2="135" stroke="#94a3b8" stroke-width="1"/>
    <line x1="56" y1="105" x2="56" y2="135" stroke="#94a3b8" stroke-width="1"/>

    <!-- Left Tension Spring -->
    <path d="M 65 120 Q 72 110, 79 120 T 93 120 T 107 120 T 120 120" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>

    <!-- Heated Ni-Chrome Resistance Wire (High thermal glow) -->
    <line x1="120" y1="120" x2="330" y2="120" stroke="url(#wireHeat)" stroke-width="3" filter="url(#intenseGlow)"/>
    <line x1="120" y1="120" x2="330" y2="120" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Right Ceramic Insulator Post -->
    <rect x="360" y="105" width="25" height="30" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="368" y1="105" x2="368" y2="135" stroke="#94a3b8" stroke-width="1"/>
    <line x1="376" y1="105" x2="376" y2="135" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Right Terminal Anchor -->
    <line x1="330" y1="120" x2="360" y2="120" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Right Stanchion / Carriage Mount -->
    <rect x="385" y="30" width="40" height="180" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="405" cy="50" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="405" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Z2</text>
    <circle cx="405" cy="190" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>

    <!-- Foam Cutting Simulation Block -->
    <g transform="translate(160, 140)">
      <!-- Foam cut kerf -->
      <path d="M 0 0 L 110 0 L 110 80 L 0 80 Z" fill="rgba(30, 58, 138, 0.7)" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,2"/>
      <path d="M 0 0 C 30 -30, 80 -10, 110 -30" stroke="#f97316" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
      <text x="55" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd" text-anchor="middle">KERF PROFILE</text>
    </g>

    <!-- Electrical Wiring Leads (High Current DC Power) -->
    <path d="M 65 120 C 65 70, 30 10, -10 10" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="-15" y="25" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ef4444" font-weight="bold">+V (PWM)</text>

    <path d="M 360 120 C 360 70, 395 10, 435 10" stroke="#0f172a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 360 120 C 360 70, 395 10, 435 10" stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="440" y="25" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" font-weight="bold">GND RETURN</text>

    <!-- Specifications Callout Box -->
    <g transform="translate(110, 195)">
      <rect x="0" y="0" width="205" height="45" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f8fafc">ELEMENT: Ni-Chrome 80/20 Resistance Wire</text>
      <text x="15" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38bdf8">TENSION: Constant Spring Compensation</text>
    </g>
  </g>
</svg>