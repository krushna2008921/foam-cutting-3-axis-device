<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="alumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="wireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="350" fill="#080c1a" rx="12"/>
  <!-- Engineering Grid -->
  <g stroke="rgba(0,240,255,0.05)" stroke-width="1">
    <line x1="0" y1="70" x2="500" y2="70"/>
    <line x1="0" y1="140" x2="500" y2="140"/>
    <line x1="0" y1="210" x2="500" y2="210"/>
    <line x1="0" y1="280" x2="500" y2="280"/>
    <line x1="70" y1="0" x2="70" y2="350"/>
    <line x1="140" y1="0" x2="140" y2="350"/>
    <line x1="210" y1="0" x2="210" y2="350"/>
    <line x1="280" y1="0" x2="280" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
    <line x1="420" y1="0" x2="420" y2="350"/>
  </g>

  <!-- Isometric CNC Frame Representation -->
  <g transform="translate(60, 40)">
    <!-- Base Table (Y-Axis Travel Bed) -->
    <polygon points="120,180 340,180 260,250 40,250" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" opacity="0.9"/>
    <!-- Foam Workpiece Block on Bed -->
    <polygon points="130,190 250,190 200,230 80,230" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <!-- Foam Block 3D height -->
    <polygon points="80,230 200,230 200,210 80,210" fill="#2563eb" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="200,230 250,190 250,170 200,210" fill="#1d4ed8" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="80,210 200,210 250,170 130,170" fill="#60a5fa" opacity="0.5"/>
    <text x="165" y="205" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffffff" text-anchor="middle">EPS FOAM WORKPIECE</text>

    <!-- Photo-referenced left support -->
    <rect x="25" y="40" width="20" height="210" fill="url(#alumGrad)" stroke="#64748b" stroke-width="1"/>
    <!-- Left Lead Screw -->
    <line x1="35" y1="50" x2="35" y2="240" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="2,2"/>
    <!-- Left Stepper Motor on top -->
    <rect x="20" y="15" width="30" height="25" rx="3" fill="#334155" stroke="#00f0ff" stroke-width="1"/>
    <!-- Left Carriage Slider -->
    <rect x="20" y="110" width="30" height="25" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>

    <!-- Photo-referenced right support -->
    <rect x="335" y="40" width="20" height="210" fill="url(#alumGrad)" stroke="#64748b" stroke-width="1"/>
    <!-- Right Lead Screw -->
    <line x1="345" y1="50" x2="345" y2="240" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="2,2"/>
    <!-- Right Stepper Motor on top -->
    <rect x="330" y="15" width="30" height="25" rx="3" fill="#334155" stroke="#00f0ff" stroke-width="1"/>
    <!-- Right Carriage Slider -->
    <rect x="330" y="110" width="30" height="25" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>

    <!-- Top Crossbar Gantry Beam (X-Axis Stabilizer) -->
    <rect x="25" y="38" width="330" height="15" fill="url(#alumGrad)" stroke="#64748b" stroke-width="1"/>

    <!-- Glowing Heated Resistance Cutting Wire -->
    <!-- Tensioned horizontally between left carriage and right carriage -->
    <line x1="50" y1="122" x2="330" y2="122" stroke="#f97316" stroke-width="3.5" filter="url(#wireGlow)"/>
    <line x1="50" y1="122" x2="330" y2="122" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Axis Movement Vector Annotations -->
    <!-- X-AXIS Arrow (Across) -->
    <g transform="translate(190, 20)">
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrow)"/>
      <polygon points="50,-4 58,0 50,4" fill="#00f0ff"/>
      <polygon points="-50,-4 -58,0 -50,4" fill="#00f0ff"/>
      <text x="0" y="-8" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="bold">X-AXIS (LATERAL)</text>
    </g>

    <!-- Y-AXIS Arrow (Depth / Bed Travel) -->
    <g transform="translate(10, 260)">
      <line x1="0" y1="15" x2="60" y2="-25" stroke="#10b981" stroke-width="2.5"/>
      <polygon points="60,-28 66,-23 58,-20" fill="#10b981"/>
      <polygon points="0,18 -6,13 2,10" fill="#10b981"/>
      <text x="35" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981" font-weight="bold">Y-AXIS (LONGITUDINAL)</text>
    </g>

    <!-- Heated Wire Callout -->
    <g transform="translate(190, 150)">
      <rect x="-80" y="0" width="160" height="22" rx="4" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1"/>
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f97316" text-anchor="middle" font-weight="bold">HEATED RESISTANCE WIRE</text>
    </g>
  </g>

  <!-- Technical Telemetry Badge -->
  <rect x="15" y="15" width="120" height="24" rx="4" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1"/>
  <text x="75" y="31" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle">2-AXIS KINEMATICS</text>
</svg>