<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="#080c1a" rx="12"/>
  <g stroke="rgba(0,240,255,0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="500" y2="80"/><line x1="0" y1="160" x2="500" y2="160"/><line x1="0" y1="240" x2="500" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/><line x1="300" y1="0" x2="300" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
  </g>
  <!-- Architectural Tower Models -->
  <g transform="translate(140, 50)">
    <!-- Tower 1 -->
    <polygon points="60,40 100,20 140,40 100,60" fill="#0284c7"/>
    <polygon points="60,40 60,190 100,210 100,60" fill="#0369a1"/>
    <polygon points="100,60 100,210 140,190 140,40" fill="#0ea5e9"/>
    <!-- Floor Levels -->
    <line x1="60" y1="70" x2="100" y2="90" stroke="#bae6fd" stroke-width="1"/>
    <line x1="100" y1="90" x2="140" y2="70" stroke="#bae6fd" stroke-width="1"/>
    <line x1="60" y1="100" x2="100" y2="120" stroke="#bae6fd" stroke-width="1"/>
    <line x1="100" y1="120" x2="140" y2="100" stroke="#bae6fd" stroke-width="1"/>
    <line x1="60" y1="130" x2="100" y2="150" stroke="#bae6fd" stroke-width="1"/>
    <line x1="100" y1="150" x2="140" y2="130" stroke="#bae6fd" stroke-width="1"/>
    <line x1="60" y1="160" x2="100" y2="180" stroke="#bae6fd" stroke-width="1"/>
    <line x1="100" y1="180" x2="140" y2="160" stroke="#bae6fd" stroke-width="1"/>

    <!-- Tower 2 (Stepped) -->
    <polygon points="150,110 180,95 210,110 180,125" fill="#38bdf8"/>
    <polygon points="150,110 150,210 180,225 180,125" fill="#0284c7"/>
    <polygon points="180,125 180,225 210,210 210,110" fill="#0ea5e9"/>

    <!-- Ground Contour Layers (Topographic foam cuts) -->
    <polygon points="10,220 210,220 250,240 50,240" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <polygon points="20,230 220,230 260,250 60,250" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <polygon points="30,240 230,240 270,260 70,260" fill="#1e3a8a" stroke="#00f0ff" stroke-width="1.5"/>
  </g>
  <rect x="20" y="20" width="190" height="24" rx="4" fill="rgba(0,240,255,0.1)" stroke="#00f0ff" stroke-width="1"/>
  <text x="115" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="middle">ARCHITECTURAL TOPOGRAPHY</text>
</svg>