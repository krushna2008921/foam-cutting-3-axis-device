<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="sanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Institutional Emblem / Hexagon Gear -->
  <g transform="translate(10, 5)">
    <polygon points="25,2 45,13 45,37 25,48 5,37 5,13" fill="none" stroke="url(#sanGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="25" cy="25" r="10" fill="none" stroke="#00f0ff" stroke-width="1.8"/>
    <circle cx="25" cy="25" r="4" fill="#00f0ff"/>
    <!-- Gear notches -->
    <path d="M25 8 L25 15 M25 35 L25 42 M8 25 L15 25 M35 25 L42 25" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- University & Dept Text -->
  <text x="65" y="24" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="1.5">SANJIVANI</text>
  <text x="65" y="38" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="11" fill="#00f0ff" letter-spacing="3">UNIVERSITY</text>
  <text x="65" y="50" font-family="'Inter', sans-serif" font-weight="400" font-size="8.5" fill="#94a3b8" letter-spacing="0.5">MAKERSPACE INNOVATION LAB</text>
</svg>